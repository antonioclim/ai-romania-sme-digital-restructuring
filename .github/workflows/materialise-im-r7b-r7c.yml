name: Materialise ignored IM-R7B and IM-R7C outputs

on:
  push:
    branches:
      - im-v3.0.0-rc1
    paths:
      - .github/workflows/materialise-im-r7b-r7c.yml

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: im-v3.0.0-rc1
          fetch-depth: 0

      - name: Materialise and force-add the hardened public outputs
        shell: bash
        run: |
          set -euo pipefail
          cat .github/im-r7-outputs-patch.part* > /tmp/im-r7-outputs-patch.b64
          base64 --decode /tmp/im-r7-outputs-patch.b64 > /tmp/im-r7-outputs-patch.tar.gz
          echo "fdef85181800802d8f07d29756a0250a950766650e9957cf924f87db09f1d838  /tmp/im-r7-outputs-patch.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/im-r7-outputs-patch.tar.gz -C .
          rm -f .github/im-r7-outputs-patch.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f \
            outputs_v3/study2/STUDY2_IM_R7B_AUDIT_GATE.json \
            outputs_v3/study2/STUDY2_PUBLIC_RESULT_SUMMARY.json \
            outputs_v3/study2/STUDY2_WEIGHTED_UNRESOLVED_ROW_SENSITIVITY_GATE.json
          git diff --cached --check
          git commit -m "Materialise hardened IM-R7B and IM-R7C outputs"
          git push origin HEAD:im-v3.0.0-rc1
