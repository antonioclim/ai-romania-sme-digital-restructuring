name: Reproducibility and release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      TZ: UTC
      LC_ALL: C.UTF-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.lock.txt

      - name: Record runtime
        run: |
          python --version
          python -m pip --version
          python -m pip check

      - name: Rebuild and verify release package
        run: make ci

      - name: Confirm generated files are committed
        run: git diff --exit-code
