name: Materialise IM-R7B and IM-R7C files

on:
  push:
    branches:
      - im-v3.0.0-rc1
    paths:
      - '.github/im-r7c-sync-patch.part*'
      - '.github/workflows/materialise-im-r7c.yml'

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: im-v3.0.0-rc1
          fetch-depth: 0

      - name: Reconstruct and verify the controlled patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/im-r7c-sync-patch.part* > /tmp/im-r7c-patch.b64
          base64 --decode /tmp/im-r7c-patch.b64 > /tmp/im-r7c-patch.tar.gz
          echo 'b3f833e0c7a06e8e84f78372ccab4d6f4dd40f23882f7e8f0a007a0cfc82c67d  /tmp/im-r7c-patch.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/im-r7c-patch.tar.gz -C .

      - name: Remove temporary materialisation files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/im-r7c-sync-patch.part*
          git rm .github/workflows/materialise-im-r7c.yml

      - name: Commit the controlled IM-R7B and IM-R7C state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialise the IM-R7B audit and freeze IM-R7C'
          git push origin HEAD:im-v3.0.0-rc1
