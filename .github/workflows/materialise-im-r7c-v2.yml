name: Materialise IM-R7B and IM-R7C files v2

on:
  push:
    branches:
      - im-v3.0.0-rc1
    paths:
      - '.github/workflows/materialise-im-r7c-v2.yml'

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release-candidate branch
        uses: actions/checkout@v4
        with:
          ref: im-v3.0.0-rc1
          fetch-depth: 0

      - name: Decode and validate controlled patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/im-r7c-sync-patch.part* | tr -d '[:space:]' > /tmp/im-r7c-patch.b64
          base64 --decode --ignore-garbage /tmp/im-r7c-patch.b64 > /tmp/im-r7c-patch.tar.gz
          gzip -t /tmp/im-r7c-patch.tar.gz
          tar -tzf /tmp/im-r7c-patch.tar.gz > /tmp/im-r7c-patch-files.txt
          grep -Fxq 'outputs_v3/study2/STUDY2_PUBLIC_RESULT_SUMMARY.json' /tmp/im-r7c-patch-files.txt
          grep -Fxq 'examples/study2_fat_production_planning/public_result_contract.yml' /tmp/im-r7c-patch-files.txt
          grep -Fxq 'BRANCH_STATUS.md' /tmp/im-r7c-patch-files.txt
          tar -xzf /tmp/im-r7c-patch.tar.gz -C .
          echo 'f656b1049d5e21e9a950ddb6bdcfe748ce06671e84d72aa979f1b58599d1aad3  outputs_v3/study2/STUDY2_PUBLIC_RESULT_SUMMARY.json' | sha256sum --check --strict
          echo 'bb9fd7f65b9323c76c7362a4d4c39a24500d1ac1e97ee90b0dcda93c4a6ca018  examples/study2_fat_production_planning/public_result_contract.yml' | sha256sum --check --strict

      - name: Remove transfer-only files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/im-r7c-sync-patch.part*
          git rm -f .github/im-r7c-sync-diagnostic.txt || true
          git rm -f .github/workflows/materialise-im-r7c.yml || true
          git rm -f .github/workflows/diagnose-im-r7c.yml || true
          git rm .github/workflows/materialise-im-r7c-v2.yml

      - name: Commit materialised state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialise the IM-R7B audit and freeze IM-R7C'
          git push origin HEAD:im-v3.0.0-rc1
