name: ODSA v3 release-candidate CI

on:
  push:
    branches:
      - im-v3.0.0-rc1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Compile Python sources
        run: python -m compileall -q odsa scripts simulations tests_v3

      - name: Run version 3 tests
        run: python -m pytest -q tests_v3

      - name: Reproduce Study 1
        run: python scripts/run_study1.py

      - name: Run deterministic smoke simulation
        run: python simulations/run_simulation.py --replications 2000 --seed 20260813

      - name: Run candidate factorial protocol in CI mode
        run: |
          python simulations/run_factorial_protocol.py \
            --mode ci \
            --output outputs_v3/factorial_protocol

      - name: Verify release-candidate version
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "3.0.0-rc1"
          python - <<'PY'
          import odsa
          assert odsa.__version__ == "3.0.0rc1"
          PY

      - name: Verify frozen full-result contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          protocol = Path("simulations/manuscript_protocol.yml")
          freeze = json.loads(
              Path("simulations/manuscript_protocol.freeze.json")
              .read_text(encoding="utf-8")
          )
          assert hashlib.sha256(protocol.read_bytes()).hexdigest() == freeze[
              "protocol_sha256"
          ]

          gate = json.loads(
              Path("outputs_v3/full_simulation/IM_R4_GATE.json")
              .read_text(encoding="utf-8")
          )
          assert gate["gate"] == "GO"
          assert gate["submission_gate"] == "NO-GO"
          assert gate["cell_count"] == 432
          assert gate["replicate_row_count"] == 1_728_000
          assert gate["core_rerun_byte_identical"] is True
          PY

      - name: Verify factorial audit boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(
              Path("outputs_v3/factorial_protocol/protocol_run_audit.json")
              .read_text(encoding="utf-8")
          )
          assert audit["status"] == "PASS"
          assert audit["mode"] == "ci"
          assert audit["manuscript_evidence"] is False
          assert audit["replicate_row_count"] == 960
          PY

      - name: Upload generated diagnostic outputs
        uses: actions/upload-artifact@v7
        with:
          name: odsa-v3-rc1-diagnostics
          path: outputs_v3/
          if-no-files-found: error
          retention-days: 30
