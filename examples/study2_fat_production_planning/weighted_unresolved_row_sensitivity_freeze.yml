schema_version: "1.0"
phase: "IM-R7C"
status: "FROZEN_POST_OUTCOME_HOSTILE_SENSITIVITY_BEFORE_WEIGHTED_UNRESOLVED_MASS_INSPECTION"
freeze_date: "2026-08-15"

purpose: >
  Quantify the sensitivity of the frozen within-source-stratum weighted
  production-planning estimates to the 986 unresolved ib9b1–ib9b5 rows. This
  is a post-outcome hostile audit. It does not replace or modify the corrected
  complete-case analysis.

post_outcome_transparency:
  substantive_outcomes_previously_rendered: true
  unresolved_weight_mass_previously_inspected: false
  outcome_definitions_changed: false
  mapped_denominator_membership_changed: false
  weighting_policy_changed: false
  suppression_policy_changed: false
  estimands_changed: false
  thresholds_changed: false

provenance:
