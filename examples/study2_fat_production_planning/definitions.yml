definitions:
  integrated_planning:
    positive_states:
    - erp
    question: Is ERP the establishment's most-used production-planning method?
    supports:
    - most_used_production_planning_method_is_erp
    does_not_support:
    - enterprise_wide_digital_transformation
    - causal_performance_effect
  specialised_planning:
    positive_states:
    - specialised_software
    - erp
    question: Is the most-used production-planning method specialised or integrated
      software?
    supports:
    - most_used_method_is_specialised_or_integrated_software
    does_not_support:
    - all_positive_establishments_use_erp
    - enterprise_wide_digital_transformation
  digitally_enabled_planning:
    positive_states:
    - standard_software
    - mobile_apps_or_digital_platforms
    - specialised_software
    - erp
    question: Is the most-used production-planning method computer- or platform-enabled
      rather than handwritten?
    supports:
    - most_used_method_is_computer_or_platform_enabled
    does_not_support:
    - all_positive_establishments_use_specialised_software
    - all_positive_establishments_use_erp
    - integrated_planning_architecture
locked_relations:
- integrated_planning_strict_subset_specialised_planning
- specialised_planning_strict_subset_digitally_enabled_planning
