[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odsa"
version = "3.0.0rc1"
description = "Outcome-Definition Sensitivity Analysis for categorical outcomes in information systems research"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Antonio Clim"}
]
dependencies = [
  "numpy==2.3.5",
  "PyYAML==6.0.3",
  "scipy==1.16.1"
]
keywords = [
  "outcome definition",
  "construct validity",
  "sensitivity analysis",
  "information systems",
  "technology adoption",
  "reproducible research"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2"
]

[project.scripts]
odsa = "odsa.cli:main"

[tool.setuptools]
packages = ["odsa"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests_v3"]
