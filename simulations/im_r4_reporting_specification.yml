interpretive_boundaries:
- No p-values across simulation cells or replications.
- No quality ranking from the sign of delta V.
- Sample rank reversals under a generating population tie are instability, not population
  reversal.
- The simulation is conditional on the frozen mechanisms and is not empirical prevalence
  evidence.
- Managerial decision-quality claims require a separate decision model or experiment.
